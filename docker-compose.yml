services:
  dmarc-analyzer:
    image: ghcr.io/upheads-int/dmarc-sjekk/dmarc-analyzer:latest
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
    volumes:
      - dmarc-data:/data
    restart: unless-stopped

volumes:
  dmarc-data:

networks:
  default:
    name: asai-proj-dmarc-sjekk